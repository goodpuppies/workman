[language-server.workman-lsp]
command = "wm"
args = ["lsp"]

[[language]]
name = "workman"
scope = "source.workman"
injection-regex = "workman"
file-types = ["wm"]
comment-tokens = ["--", "//"]
indent = { tab-width = 2, unit = "  " }
grammar = "workman"
language-servers = ["workman-lsp"]

[[grammar]]
name = "workman"
source = { git = "https://github.com/goodpuppies/tree-sitter-workman", rev = "aff47ac36b7ef409a4a03abb30e1b78f6cb853a8" }
