name: Publish to JSR

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # src/module_scope.wm imports SubsetML's scope rules from the submodule.
          submodules: true
      - uses: denoland/setup-deno@v2
        with:
          # generate-assets embeds `deno types`; it must match the Deno that built the release.
          deno-version: 2.9.8
      - run: deno install --frozen
      - name: Verify generated assets
        run: |
          deno task c-header:check
          deno task generate-assets
          test -z "$(git status --porcelain -- src/generated)"
      - name: Publish package
        run: deno publish
